# Unwired Section 2 extraction boundary for climate.lilly_air.
# Each action is copied verbatim from the source_path in automations.yaml.
# The parent supervisor remains authoritative until a later integration change.
#
# Explicit dependency contract (all dependencies are parent-supplied):
# - Variables: kb_lilly_cool, lilly_truth_ok, kids_bedtime, lilly_temp,
#   ly_on_at, ly_off_at, ly_current, and ly_setpoint.
# - Entity/action context: climate.lilly_air must exist and support the climate
#   set_temperature, set_fan_mode (including turbo), and set_hvac_mode services.
# - Evaluation context: Home Assistant supplies Jinja evaluation and sequential,
#   fail-stop action semantics; the parent supplies the source-path branch gates,
#   variable scope, and action ordering in which these fragments execute.
# - Parent provenance: lilly_temp/lilly_truth_ok derive from Lilly room truth;
#   ly_current and kb_lilly_cool incorporate climate.lilly_air state; ly_on_at and
#   ly_off_at incorporate the parent's away profile; kids_bedtime uses HA local
#   time; and the parent owns season/manual-override eligibility outside here.
#
# This artifact preserves the currently loaded automations.yaml source semantics,
# including its 18:00-07:00 kids_bedtime definition. Separate doctrine proposes
# a Lilly-specific 19:00-07:00 window. That timing conflict remains unresolved
# and MUST NOT be silently resolved in this unwired extraction artifact.
- source_path: [action, 1, then, 2]
  action:
    if:
      - condition: template
        value_template: "{{ kb_lilly_cool }}"
    then:
      - action: climate.set_temperature
        target: { entity_id: climate.lilly_air }
        data: { hvac_mode: "cool", temperature: 61 }
      - action: climate.set_fan_mode
        target: { entity_id: climate.lilly_air }
        data: { fan_mode: "turbo" }
    else:
      - action: climate.set_hvac_mode
        target: { entity_id: climate.lilly_air }
        data: { hvac_mode: "off" }

- source_path: [action, 2, choose, 0, sequence, 6]
  action:
    if:
      - condition: template
        value_template: "{{ lilly_truth_ok }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not kids_bedtime }}"
        then:
          - action: climate.set_temperature
            target: { entity_id: climate.lilly_air }
            data:
              hvac_mode: >-
                {% if lilly_temp >= ly_on_at %}cool
                {% elif lilly_temp <= ly_off_at %}off
                {% elif ly_current == 'cool' %}cool
                {% else %}off{% endif %}
              temperature: "{{ ly_setpoint }}"
          - action: climate.set_fan_mode
            target: { entity_id: climate.lilly_air }
            data: { fan_mode: "turbo" }
    else:
      - if:
          - condition: template
            value_template: "{{ not kids_bedtime }}"
        then:
          - action: climate.set_hvac_mode
            target: { entity_id: climate.lilly_air }
            data: { hvac_mode: "off" }

- source_path: [action, 2, choose, 1, sequence, 0, default, 0, default, 5]
  action:
    if:
      - condition: template
        value_template: "{{ lilly_truth_ok }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not kids_bedtime }}"
        then:
          - action: climate.set_temperature
            target: { entity_id: climate.lilly_air }
            data:
              hvac_mode: >-
                {% if lilly_temp >= ly_on_at %}cool
                {% elif lilly_temp <= ly_off_at %}off
                {% elif ly_current == 'cool' %}cool
                {% else %}off{% endif %}
              temperature: "{{ ly_setpoint }}"
          - action: climate.set_fan_mode
            target: { entity_id: climate.lilly_air }
            data: { fan_mode: "turbo" }
    else:
      - if:
          - condition: template
            value_template: "{{ not kids_bedtime }}"
        then:
          - action: climate.set_hvac_mode
            target: { entity_id: climate.lilly_air }
            data: { hvac_mode: "off" }

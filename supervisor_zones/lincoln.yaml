# Unwired Section 2 extraction boundary for climate.lincoln_air.
# Each action is copied verbatim from the source_path in automations.yaml.
# The parent supervisor remains authoritative until a later integration change.
#
# Explicit dependency contract (all dependencies are parent-supplied):
# - Variables: kb_lincoln_cool, lincoln_truth_ok, kids_bedtime, lincoln_temp,
#   l_on_at, l_off_at, l_current, and l_setpoint.
# - Entity/action context: climate.lincoln_air must exist and support the climate
#   set_temperature, set_fan_mode (including turbo), and set_hvac_mode services.
# - Evaluation context: Home Assistant supplies Jinja evaluation and sequential,
#   fail-stop action semantics; the parent supplies the source-path branch gates,
#   variable scope, and action ordering in which these fragments execute.
# - Parent provenance: lincoln_temp/lincoln_truth_ok derive from Lincoln room
#   truth; l_current and kb_lincoln_cool incorporate climate.lincoln_air state;
#   l_on_at and l_off_at incorporate the parent's away profile; kids_bedtime uses
#   HA local time; and the parent owns season/manual-override eligibility outside
#   here.
#
# This artifact preserves the currently loaded automations.yaml source semantics.
# The live source remains authoritative. Any unrelated timing or policy conflict
# remains unresolved and MUST NOT be silently resolved in this unwired artifact.
- source_path: [action, 1, then, 1]
  action:
    if:
      - condition: template
        value_template: "{{ kb_lincoln_cool }}"
    then:
      - action: climate.set_temperature
        target: { entity_id: climate.lincoln_air }
        data: { hvac_mode: "cool", temperature: 61 }
      - action: climate.set_fan_mode
        target: { entity_id: climate.lincoln_air }
        data: { fan_mode: "turbo" }
    else:
      - action: climate.set_hvac_mode
        target: { entity_id: climate.lincoln_air }
        data: { hvac_mode: "off" }

- source_path: [action, 2, choose, 0, sequence, 4]
  action:
    if:
      - condition: template
        value_template: "{{ lincoln_truth_ok }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not kids_bedtime }}"
        then:
          - action: climate.set_temperature
            target: { entity_id: climate.lincoln_air }
            data:
              hvac_mode: >-
                {% if lincoln_temp >= l_on_at %}cool
                {% elif lincoln_temp <= l_off_at %}off
                {% elif l_current == 'cool' %}cool
                {% else %}off{% endif %}
              temperature: "{{ l_setpoint }}"
          - action: climate.set_fan_mode
            target: { entity_id: climate.lincoln_air }
            data: { fan_mode: "turbo" }
    else:
      - if:
          - condition: template
            value_template: "{{ not kids_bedtime }}"
        then:
          - action: climate.set_hvac_mode
            target: { entity_id: climate.lincoln_air }
            data: { hvac_mode: "off" }

- source_path: [action, 2, choose, 1, sequence, 0, default, 0, default, 3]
  action:
    if:
      - condition: template
        value_template: "{{ lincoln_truth_ok }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not kids_bedtime }}"
        then:
          - action: climate.set_temperature
            target: { entity_id: climate.lincoln_air }
            data:
              hvac_mode: >-
                {% if lincoln_temp >= l_on_at %}cool
                {% elif lincoln_temp <= l_off_at %}off
                {% elif l_current == 'cool' %}cool
                {% else %}off{% endif %}
              temperature: "{{ l_setpoint }}"
          - action: climate.set_fan_mode
            target: { entity_id: climate.lincoln_air }
            data: { fan_mode: "turbo" }
    else:
      - if:
          - condition: template
            value_template: "{{ not kids_bedtime }}"
        then:
          - action: climate.set_hvac_mode
            target: { entity_id: climate.lincoln_air }
            data: { hvac_mode: "off" }
